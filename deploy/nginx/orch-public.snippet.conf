# Orchestrateur d'agents IA : routes publiques sur mymcps.duckdns.org (incluses dans le server 443).
# Meme schema que /tasks : OAuth publique par nature + /orch/mcp seul -> orch-gateway 127.0.0.1:8801.
# L'API runner n'est JAMAIS publique (orch-runner.conf, IP NetBird uniquement).
location = /.well-known/oauth-protected-resource/orch/mcp {
    proxy_pass http://127.0.0.1:8801/.well-known/oauth-protected-resource/orch/mcp;
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
}
location = /.well-known/oauth-authorization-server/oauth/orch {
    proxy_pass http://127.0.0.1:8801/.well-known/oauth-authorization-server;
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
}
location ~ ^/oauth/orch/(authorize|token|register|revoke|consentement) {
    rewrite ^/oauth/orch(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:8801;
    proxy_http_version 1.1;
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_buffering     off;
    proxy_cache         off;
    proxy_read_timeout  60s;
    proxy_send_timeout  60s;
}
location ~ ^/orch/(authorize|token|register|revoke|consentement) { return 301 https://$host/oauth/orch/$1$is_args$args; }
location ~ ^/orch/\.well-known/(.*)$ { return 301 https://$host/.well-known/$1; }
location = /orch/mcp/ { return 404; }
location ~ ^/orch/mcp/ { return 404; }
location = /orch/mcp {
    rewrite ^/orch(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:8801;
    proxy_http_version 1.1;
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_buffering     off;
    proxy_cache         off;
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
}
