# API runner de l'orchestrateur : IP NetBird (PC Windows) + loopback (poller Hermes local).
# Pas d'exposition publique, pas de /mcp ici. X-Real-IP est pose par nginx : l'upstream
# verifie que l'origine est dans l'overlay (ORCH_RUNNER_CIDRS) en plus du jeton runner.

limit_req_zone  $binary_remote_addr zone=orch_runner_req:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=orch_runner_conn:10m;

log_format orch_runner_fmt '$time_local $remote_addr "$request_method $uri" $status rt=$request_time';

server {
    listen 10.200.114.203:8803;
    listen 127.0.0.1:8803;
    server_name _;

    server_tokens off;
    client_max_body_size 300k;
    client_body_timeout 20s;

    limit_req  zone=orch_runner_req burst=60 nodelay;
    limit_conn orch_runner_conn 16;
    limit_req_status 429;
    limit_conn_status 429;

    access_log /var/log/nginx/orch_runner_access.log orch_runner_fmt;
    error_log  /var/log/nginx/orch_runner_error.log;

    allow 127.0.0.1;
    allow 10.200.0.0/16;
    deny all;

    location ~ ^/runner/v1/(hello|heartbeat|job-state|claim|event|transition)$ {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8802;
        proxy_http_version 1.1;
        proxy_set_header Host            127.0.0.1:8802;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection      "";
        proxy_buffering    off;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8802;
        proxy_set_header Host 127.0.0.1:8802;
    }

    location / { return 444; }
}
